<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sous logo — chef hat over cookie">
  <defs>
    <linearGradient id="sousHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#F3D9A4"/>
    </linearGradient>
    <linearGradient id="sousCookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B544"/>
      <stop offset="1" stop-color="#C97A1B"/>
    </linearGradient>
  </defs>
  <!-- cookie -->
  <circle cx="32" cy="40" r="18" fill="url(#sousCookie)"/>
  <circle cx="25" cy="36" r="2.4" fill="#5B2E0E"/>
  <circle cx="35" cy="34" r="2" fill="#5B2E0E"/>
  <circle cx="39" cy="43" r="2.4" fill="#5B2E0E"/>
  <circle cx="29" cy="45" r="1.8" fill="#5B2E0E"/>
  <circle cx="33" cy="40" r="1.6" fill="#5B2E0E"/>
  <!-- bite -->
  <circle cx="49" cy="30" r="6" fill="#0A0A0B"/>
  <!-- chef hat -->
  <g>
    <ellipse cx="32" cy="16" rx="14" ry="9" fill="url(#sousHat)"/>
    <circle cx="20" cy="15" r="6.5" fill="url(#sousHat)"/>
    <circle cx="32" cy="11" r="7.5" fill="url(#sousHat)"/>
    <circle cx="44" cy="15" r="6.5" fill="url(#sousHat)"/>
    <rect x="21" y="20" width="22" height="8" rx="2.5" fill="url(#sousHat)"/>
    <rect x="21" y="25.5" width="22" height="2.5" fill="#C97A1B" opacity="0.55"/>
  </g>
</svg>
